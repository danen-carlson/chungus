name: Chungus
options:
  bundleIdPrefix: com.chungus
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: AQQ8UWSCZC
    CODE_SIGN_STYLE: Automatic

targets:

  Chungus:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ChungusApp.swift
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: Utilities
      - path: Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chungus.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Chungus
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # HealthKit
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Chungus reads your workout history to track your progress."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Chungus saves your workouts to Apple Health."
    entitlements:
      path: Chungus.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - target: ChungusWatch
        embed: true

  ChungusWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chungus.app.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Chungus
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.chungus.app

schemes:
  Chungus:
    build:
      targets:
        Chungus: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
